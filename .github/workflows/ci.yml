name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_NAME: obstg

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ env.APP_NAME }}:${{ github.sha }}" \
            .

      - name: Build migration image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.migrate \
            -t "${{ env.APP_NAME }}-migrate:${{ github.sha }}" \
            .

      - name: Export images
        run: |
          docker save \
            "${{ env.APP_NAME }}:${{ github.sha }}" \
            "${{ env.APP_NAME }}-migrate:${{ github.sha }}" \
            | gzip > "${{ env.APP_NAME }}-${{ github.sha }}.tar.gz"

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-images
          path: ${{ env.APP_NAME }}-${{ github.sha }}.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-images

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H \
            "${{ secrets.DEPLOY_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Upload images
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/deploy_key \
            "${{ env.APP_NAME }}-${{ github.sha }}.tar.gz" \
            "$USER@$HOST:/tmp/${{ env.APP_NAME }}-${{ github.sha }}.tar.gz"

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "
            set -e

            echo 'Loading Docker images...'
            gunzip -c /tmp/${{ env.APP_NAME }}-${{ github.sha }}.tar.gz | docker load

            echo 'Updating application version...'
            sed -i 's/^APP_VERSION=.*/APP_VERSION=${{ github.sha }}/' /opt/${{ env.APP_NAME }}/.env

            echo 'Starting application...'
            cd /opt/${{ env.APP_NAME }}
            docker compose up -d

            echo 'Cleaning up...'
            rm -f /tmp/${{ env.APP_NAME }}-${{ github.sha }}.tar.gz

            echo 'Deployment complete'
            docker compose ps
          "
